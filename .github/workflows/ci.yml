name: CI

on:
  push:
  pull_request:

env:
  NODE_VERSION: '24'

jobs:
  check:
    name: Lint / typecheck / test / build / smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated code is up to date
        # Сгенерированное из contract/ коммитится и руками не правится (ADR 0004):
        # падаем, если оно разошлось с контрактом. --intent-to-add нужен, чтобы
        # git diff увидел и новые, ещё не закоммиченные файлы генерации
        run: |
          npm run generate
          git add --intent-to-add --all
          git diff --exit-code

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Smoke test
        # Локальный режим: скрипт сам поднимает собранное приложение
        run: npm run smoke

      - name: Install Playwright Chromium
        # Браузер и его системные зависимости; версия — из @playwright/test в lock-файле
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        # Playwright сам поднимает собранное приложение на временной БД
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker:
    name: Docker build & smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node нужен только для запуска smoke-скрипта (он без зависимостей)
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build image
        run: docker build -t call-calendar-ci .

      # Нестандартный PORT: проверяем, что приложение слушает порт из окружения
      - name: Run container
        run: docker run -d -e PORT=8080 -p 3100:8080 --name call-calendar call-calendar-ci

      - name: Smoke test against container
        run: SMOKE_URL=http://localhost:3100 node scripts/smoke.mjs

      - name: Stop container
        if: always()
        run: docker stop call-calendar || true
