name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      contains(github.event.comment.body, ' /opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
        with:
          model: opencode/kimi-k3
          mentions: "/oc, /opencode"
          prompt: |
              Follow the repository's AGENTS.md instructions.
              Before committing any changes, read the root AGENTS.md
              and follow its commit message conventions.

              All commit messages MUST use Conventional Commits:
              <type>: <description>
              or <type>(<scope>): <description>

              Examples:
              - fix: calendar month reset on return
              - feat(web): add booking confirmation
              - test(api): cover missing event type

              Never use a plain descriptive sentence as a commit message.
              Before creating each commit, verify that its message
              follows Conventional Commits. If it does not, rewrite it.
              
              Continue to follow the user's request from the GitHub comment.